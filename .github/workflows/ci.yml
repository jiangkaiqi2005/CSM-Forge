name: kernel-ci
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    name: kernel-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'
      - name: Record exact revision and SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          git rev-parse HEAD | Set-Content artifacts/commit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --info | Tee-Object -FilePath artifacts/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile production libraries and tests for net35 and net8
        shell: pwsh
        run: |
          dotnet build tests/Forge.Tests/Forge.Tests.csproj -c Release --nologo 2>&1 | Tee-Object -FilePath artifacts/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run production-kernel tests on modern runtime
        shell: pwsh
        run: |
          dotnet run --project tests/Forge.Tests/Forge.Tests.csproj -c Release -f net8.0 --no-build 2>&1 | Tee-Object -FilePath artifacts/tests-net8.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Mono test runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y mono-runtime
      - name: Run the actual net35 build on Mono (not the game runtime)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          mono --version | Tee-Object -FilePath artifacts/mono-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mono tests/Forge.Tests/bin/Release/net35/CSM.Forge.Tests.exe 2>&1 | Tee-Object -FilePath artifacts/tests-net35-mono.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build and test evidence (no game binaries)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: kernel-evidence-${{ matrix.os }}
          path: artifacts/*.txt
          if-no-files-found: warn
          retention-days: 14

  runtime-package:
    name: runtime-package-windows
    needs: kernel
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'
      - name: Prepare isolated CS1 reference assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'csm-cs1-reference-assemblies.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'csm-cs1-reference-extract'
          $managed = Join-Path $env:RUNNER_TEMP 'csm-cs1-managed'
          Invoke-WebRequest 'https://storage.citiesskylinesmultiplayer.com/Assemblies.zip' -OutFile $zip -TimeoutSec 180
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force $managed | Out-Null
          foreach ($name in @('Assembly-CSharp.dll','ColossalManaged.dll','ICities.dll','UnityEngine.dll')) {
            $matches = @(Get-ChildItem $extract -Recurse -File -Filter $name)
            if ($matches.Count -ne 1) { throw "Expected exactly one CS1 reference assembly $name; found $($matches.Count)." }
            Copy-Item -LiteralPath $matches[0].FullName -Destination (Join-Path $managed $name)
          }
          $ui = @(Get-ChildItem $extract -Recurse -File -Filter 'UnityEngine.UI.dll')
          if ($ui.Count -eq 1) { Copy-Item -LiteralPath $ui[0].FullName -Destination (Join-Path $managed 'UnityEngine.UI.dll') }
          "CS1_MANAGED=$managed" >> $env:GITHUB_ENV
          "REFERENCE_ARCHIVE_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Probe CS1 DLC manager metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet run --project tools/Forge.MetadataProbe/Forge.MetadataProbe.csproj -c Release -- \
            (Join-Path $env:CS1_MANAGED 'Assembly-CSharp.dll') \
            EventManager EventData EventAI DisasterManager DisasterData DisasterAI DistrictPark \
            2>&1 | Tee-Object -FilePath artifacts/cs1-dlc-metadata.txt
          if ($LASTEXITCODE -ne 0) { throw "CS1 metadata probe failed: $LASTEXITCODE" }
      - name: Build and stage installable Forge runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'forge-runtime'
          & pwsh -NoProfile -File scripts/build-runtime.ps1 -CitiesManagedPath $env:CS1_MANAGED -Configuration Release -OutputPath $output
          if ($LASTEXITCODE -ne 0) { throw "Runtime package build failed: $LASTEXITCODE" }
      - name: Add provenance and finalize ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'forge-runtime'
          $stage = Join-Path $root 'CSM-Forge'
          $zip = Join-Path $root 'CSM-Forge-runtime.zip'
          $sourceCommit = (git rev-parse HEAD).Trim()
          $dlls = @(Get-ChildItem $stage -File -Filter '*.dll' | Sort-Object Name | ForEach-Object {
            [ordered]@{ name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          [ordered]@{
            repository=$env:GITHUB_REPOSITORY
            source_commit=$sourceCommit
            source_ref='${{ github.event.pull_request.head.ref || github.ref }}'
            run_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            built_at_utc=[DateTime]::UtcNow.ToString('o')
            target_framework='net35'
            cs1_reference_archive_sha256=$env:REFERENCE_ARCHIVE_SHA256
            gameplay_validation='NOT RUN BY CI'
            dlls=$dlls
          } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $stage 'BUILD_INFO.json') -Encoding UTF8
          $manifest = @()
          Get-ChildItem -LiteralPath $stage -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            $fileHash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            $manifest += ('{0}  {1}' -f $fileHash.Hash.ToLowerInvariant(), $_.Name)
          }
          $manifest | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          & pwsh -NoProfile -File (Join-Path $stage 'VERIFY-ALPHA-INSTALL.ps1') -Root $stage
          if ($LASTEXITCODE -ne 0) { throw "Staged Alpha verification failed: $LASTEXITCODE" }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CSM-Forge-runtime.zip" | Set-Content (Join-Path $root 'CSM-Forge-runtime.zip.sha256') -Encoding ascii
          "Runtime ZIP SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload installable runtime and evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CSM-Forge-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/forge-runtime/CSM-Forge-runtime.zip
            ${{ runner.temp }}/forge-runtime/CSM-Forge-runtime.zip.sha256
            ${{ runner.temp }}/forge-runtime/CSM-Forge/BUILD_INFO.json
            ${{ runner.temp }}/forge-runtime/CSM-Forge/SHA256SUMS.txt
            artifacts/cs1-dlc-metadata.txt
          if-no-files-found: error
          retention-days: 30
