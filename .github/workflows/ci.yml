name: kernel-ci
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    name: kernel-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'
      - name: Record exact revision and SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          git rev-parse HEAD | Set-Content artifacts/commit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --info | Tee-Object -FilePath artifacts/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile production libraries and tests for net35 and net8
        shell: pwsh
        run: |
          dotnet build tests/Forge.Tests/Forge.Tests.csproj -c Release --nologo 2>&1 | Tee-Object -FilePath artifacts/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run production-kernel tests on modern runtime
        shell: pwsh
        run: |
          dotnet run --project tests/Forge.Tests/Forge.Tests.csproj -c Release -f net8.0 --no-build 2>&1 | Tee-Object -FilePath artifacts/tests-net8.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Mono test runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y mono-runtime
      - name: Run the actual net35 build on Mono (not the game runtime)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          mono --version | Tee-Object -FilePath artifacts/mono-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mono tests/Forge.Tests/bin/Release/net35/CSM.Forge.Tests.exe 2>&1 | Tee-Object -FilePath artifacts/tests-net35-mono.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build and test evidence (no game binaries)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: kernel-evidence-${{ matrix.os }}
          path: artifacts/*.txt
          if-no-files-found: warn
          retention-days: 14
